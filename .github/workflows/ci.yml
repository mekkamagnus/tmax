name: CI
on: [push, pull_request]

# One CI run per ref — a new push cancels the previous run's still-queued /
# hung jobs instead of stacking them (drain protection for the shared
# Actions budget).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run typecheck:src
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run typecheck:test
  typecheck-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run typecheck
  test-bun:
    runs-on: ubuntu-latest
    # Hard ceiling: the raw `bun test` this job used to run hung for HOURS
    # per run (no per-test timeout; it swept adw-* tests that spawn real LLM
    # CLI subprocesses, which wait forever on an un-authed headless runner,
    # plus every daemon/socket suite). 20min comfortably covers the
    # legitimate ~13min suite; the ceiling exists so a future hang dies in
    # minutes, not hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      # The project's hardened unit runner (BUG-16): ONE `bun test --parallel`
      # invocation (#239) with a per-test timeout, --dots steady output + a
      # 120s inactivity kill, and adw-* EXCLUDED (they spawn LLM subprocesses —
      # integration territory). Never raw `bun test` in CI.
      # #241: carry per-file timings across runs (actions/cache, rolling key)
      # so --parallel starts the slowest files first and any future --shard
      # matrix has data to balance on. Tolerates a cold cache (missing file).
      - uses: actions/cache/restore@v4
        with:
          path: .unit-test-timings.json
          key: unit-test-timings-${{ github.run_id }}
          restore-keys: |
            unit-test-timings-
      - run: bun run test:unit --timings=.unit-test-timings.json --update-timings
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .unit-test-timings.json
          key: unit-test-timings-${{ github.run_id }}
  test-tmax-use:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install
      - run: bun run test:tmax-use
